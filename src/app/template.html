<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quản lý nhân sự Thiên Nhật Minh (bản thử giao diện)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#edf0f3;--surface:#ffffff;--soft:#f4f6f8;--ink:#16222e;--muted:#5b6b7b;--line:#d5dce3;
  --brand:#1f3f5e;--brand-ink:#ffffff;--accent:#f5b800;--accent-soft:#fff1b8;
  --ok:#1d6f46;--ok-bg:#e0f2e8;--warn:#7a5200;--warn-bg:#fff0c2;--bad:#a8231b;--bad-bg:#fbe3e0;--focus:#1f6fd1;
  color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:14px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
.side{background:var(--surface);border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:20px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;gap:10px;align-items:center;padding:0 6px}
.mark{width:38px;height:38px;border-radius:6px;background:var(--accent);color:#1a1400;font-weight:700;display:grid;place-items:center;font-size:13px;letter-spacing:.02em;flex:none}
.brand b{display:block;font-size:15px;line-height:1.2}
.brand span{font-size:12px;color:var(--muted)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{all:unset;cursor:pointer;display:flex;justify-content:space-between;align-items:center;padding:9px 12px;border-radius:6px;border-left:3px solid transparent;color:var(--muted);font-weight:500}
.nav button:hover{background:var(--soft);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--soft);color:var(--ink);border-left-color:var(--accent);font-weight:600}
.nav button:focus-visible{outline:2px solid var(--focus)}
.count{background:var(--bad);color:#fff;border-radius:999px;font-size:12px;font-weight:600;padding:0 7px;min-width:22px;text-align:center}
.side .foot{margin-top:auto;display:flex;flex-direction:column;gap:10px;font-size:12px;color:var(--muted)}
.seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{all:unset;cursor:pointer;flex:1;text-align:center;padding:7px 4px;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink);font-weight:600}
.seg button:focus-visible{outline:2px solid var(--focus);outline-offset:-2px}
.main{padding:28px clamp(16px,3vw,40px) 60px;min-width:0}
.head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:18px}
h1{font-size:24px;line-height:1.25;margin:0;font-weight:700}
h2{font-size:16px;margin:0 0 10px;font-weight:600}
.sub{color:var(--muted);margin:2px 0 0}
.btn{cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:8px 14px;font-weight:600;display:inline-flex;gap:6px;align-items:center}
.btn:hover{background:var(--soft)}
.btn.primary{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.btn.primary:hover{filter:brightness(1.1)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:4px 10px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.bar{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px}
.in{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 10px;min-width:0}
.in[readonly],.in:disabled{background:var(--soft);color:var(--muted)}
.bar .grow{flex:1 1 240px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{text-align:left;color:var(--muted);font-weight:500;font-size:13px;padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr[data-a]{cursor:pointer}
tbody tr[data-a]:hover{background:var(--soft)}
.name{font-weight:600}
.muted{color:var(--muted)}
.pill{display:inline-block;border-radius:999px;padding:1px 9px;font-size:12px;font-weight:600;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.none{background:var(--soft);color:var(--muted)}
.empty{padding:36px 16px;text-align:center;color:var(--muted)}
.back{all:unset;cursor:pointer;color:var(--muted);font-weight:500;margin-bottom:10px;display:inline-block}
.back:hover{color:var(--ink)}
.back:focus-visible{outline:2px solid var(--focus)}
.cols{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:20px;align-items:start}
.dl{display:grid;grid-template-columns:120px 1fr;gap:0}
.dl dt,.dl dd{margin:0;padding:9px 16px;border-bottom:1px solid var(--line)}
.dl dt{color:var(--muted)}
.dl dd{word-break:break-word}
.dl dt:nth-last-of-type(1),.dl dd:last-of-type{border-bottom:0}
.cert{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) auto;gap:8px 16px;padding:14px 16px;border-bottom:1px solid var(--line);align-items:center}
.cert:last-child{border-bottom:0}
.cert .t{font-weight:600}
.cert .en{font-size:12px;color:var(--muted)}
.cert .links{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.linkbtn{all:unset;cursor:pointer;color:var(--focus);font-size:13px;text-decoration:underline;text-underline-offset:2px}
.linkbtn:focus-visible{outline:2px solid var(--focus)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 14px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.sigs{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.sig{overflow:hidden}
.sig .pic{height:110px;display:grid;place-items:center;border-bottom:1px solid var(--line);background-color:var(--surface);background-image:linear-gradient(45deg,var(--soft) 25%,transparent 25%,transparent 75%,var(--soft) 75%),linear-gradient(45deg,var(--soft) 25%,transparent 25%,transparent 75%,var(--soft) 75%);background-size:16px 16px;background-position:0 0,8px 8px}
.sig .pic img{max-height:84px;max-width:86%}
.sig .body{padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.field label{font-weight:600;font-size:13px}
.field .in{width:100%}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.auto{background:var(--accent-soft)!important;border-color:var(--accent)!important}
.backdrop{position:fixed;inset:0;background:rgba(10,18,26,.55);display:flex;justify-content:center;align-items:flex-start;padding:5vh 16px;overflow:auto;z-index:50}
.modal{background:var(--surface);border-radius:10px;width:100%;max-width:560px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.modal.wide{max-width:900px}
.modal header{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
.modal header h2{margin:0;font-size:17px}
.modal .bodyc{padding:18px 20px}
.modal footer{display:flex;justify-content:flex-end;gap:8px;padding:14px 20px;border-top:1px solid var(--line);flex-wrap:wrap}
.x{all:unset;cursor:pointer;font-size:22px;line-height:1;padding:2px 8px;color:var(--muted)}
.x:focus-visible{outline:2px solid var(--focus)}
.drop{display:block;border:2px dashed var(--line);border-radius:8px;padding:18px;text-align:center;cursor:pointer;color:var(--muted)}
.drop:hover{border-color:var(--accent)}
.drop input{display:none}
.drop:focus-within{outline:2px solid var(--focus)}
.prev{margin:10px 0;display:none;gap:12px;align-items:flex-start}
.prev.on{display:flex}
.prev img{width:150px;border:1px solid var(--line);border-radius:6px;background:#fff}
.ocr{font-size:13px;flex:1}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--brand);border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:8px;font-weight:500;z-index:80;max-width:90vw}
.note{background:var(--soft);border-radius:6px;padding:10px 12px;font-size:13px;color:var(--muted)}
/* Phiếu thông tin công nhân: luôn nền trắng như bản in */
.paper{background:#fff;color:#111;border:1px solid #c9d0d7;padding:26px 30px;font-size:12px;line-height:1.45;font-family:"Be Vietnam Pro",Arial,sans-serif}
.paper h3{text-align:center;margin:0;font-size:15px}
.paper .co{text-align:center;font-weight:600;margin:2px 0 14px}
.paper .top{display:grid;grid-template-columns:1fr 92px;gap:14px}
.paper .photo{border:1px solid #888;height:120px;display:grid;place-items:center;color:#777;font-size:11px;text-align:center}
.paper .row{display:grid;grid-template-columns:230px 1fr;border-bottom:1px solid #ddd;padding:3px 0}
.paper .row b{font-weight:600}
.paper .sec{margin-top:12px;font-weight:700;border-bottom:2px solid #111;padding-bottom:2px}
.paper .ticks{display:grid;grid-template-columns:1fr 1fr;gap:4px 18px;margin-top:8px}
.paper .tk{display:flex;gap:6px;align-items:flex-start}
.paper .box{font-size:15px;line-height:1}
.paper .sign{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:16px;text-align:center}
.paper .sigimg{height:62px;display:grid;place-items:center}
.paper .sigimg img{max-height:58px;max-width:90%}
.paper .fine{margin-top:14px;font-size:10.5px;color:#444}
.print-only{display:none}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;padding:12px;gap:10px;border-right:0;border-bottom:1px solid var(--line)}
  .nav{flex-direction:row;overflow-x:auto;max-width:100%}
  .nav button{white-space:nowrap}
  .side .foot{margin:0;flex-direction:row;align-items:center;flex-wrap:wrap}
  .cols{grid-template-columns:1fr}
  .cert{grid-template-columns:1fr}
  .grid2{grid-template-columns:1fr}
  .paper{padding:16px}
  .paper .row{grid-template-columns:1fr}
  .paper .top{grid-template-columns:1fr}
  .paper .ticks,.paper .sign{grid-template-columns:1fr}
}
@media print{
  html,body{background:#fff}
  .app,.toast,.no-print{display:none!important}
  .backdrop{position:static;background:none;padding:0;display:block;overflow:visible}
  .modal{box-shadow:none;max-width:none;border-radius:0}
  .modal .bodyc{padding:0}
  .paper{border:0;padding:0}
  .print-only{display:block;page-break-before:always;text-align:center}
  .print-only img{max-width:100%;border:1px solid #ccc}
}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:2.4s}}
</style>
</head>

function expText(startStr,endStr){
  const a=parse(startStr),b=parse(endStr);
  let m=(b.getFullYear()-a.getFullYear())*12+(b.getMonth()-a.getMonth());
  if(b.getDate()<a.getDate())m--;
  if(m<0)m=0;
  const y=Math.floor(m/12),r=m%12;
  return (y?y+' năm':'')+(y&&r?' ':'')+(r||!y?r+' tháng':'');

/* ---------- Trạng thái chứng chỉ ---------- */
function cs(cert){
  if(!cert)return {k:'none',t:'Chưa có'};
  const d=daysLeft(cert.exp);
  if(d<0)return {k:'bad',t:'Hết hạn '+(-d)+' ngày',d};
  if(d<=30)return {k:'warn',t:'Còn '+d+' ngày',d};
  return {k:'ok',t:'Còn hiệu lực',d};
}
function counts(e){
  const r={bad:0,warn:0,ok:0};
  Object.values(e.certs).forEach(x=>{r[cs(x).k]++});
  return r;
}
function empPill(e){
  const r=counts(e);
  if(r.bad)return `<span class="pill bad">${r.bad} hết hạn</span>`;
  if(r.warn)return `<span class="pill warn">${r.warn} sắp hết hạn</span>`;
  if(r.ok)return `<span class="pill ok">${r.ok} còn hiệu lực</span>`;
  return `<span class="pill none">Chưa có chứng chỉ</span>`;
}
function alertItems(){
  const out=[];
  S.emps.forEach(e=>Object.entries(e.certs).forEach(([k,x])=>{
    const d=daysLeft(x.exp);
    if(d<=60)out.push({e,k,x,d});
  }));
  return out.sort((a,b)=>a.d-b.d);
}
const alertCount=()=>alertItems().filter(i=>i.d<=30).length;

function filtered(){
  const q=norm(S.q.trim());
  return S.emps.filter(e=>{
    if(q&&!(norm(e.name).includes(q)||norm(e.code).includes(q)||norm(e.phone).includes(q.replace(/\s/g,''))||norm(e.phone).replace(/\s/g,'').includes(q.replace(/\s/g,''))))return false;
    if(S.pos&&e.pos!==S.pos)return false;
    const r=counts(e);
    if(S.st==='bad'&&!r.bad)return false;
    if(S.st==='warn'&&!r.warn)return false;
    return true;
  });
}

function removeBg(url){
  return new Promise(res=>{
    const im=new Image();
    im.onload=()=>{try{
      const cv=document.createElement('canvas'),w=Math.min(im.width,600),h=Math.round(im.height*w/im.width);
      cv.width=w;cv.height=h;const cx=cv.getContext('2d');cx.drawImage(im,0,0,w,h);
      const d=cx.getImageData(0,0,w,h),p=d.data;
      for(let i=0;i<p.length;i+=4){
        const l=p[i]*.3+p[i+1]*.59+p[i+2]*.11;
        const a=l>225?0:l>160?Math.round((225-l)/65*255):255;
        p[i+3]=Math.min(p[i+3],a);
      }
      cx.putImageData(d,0,0);res(cv.toDataURL('image/png'));
    }catch(err){res(url)}};
    im.onerror=()=>res(url);im.src=url;
  });
}

/* ---------- Đọc thông tin từ ảnh CCCD ---------- */
let SAMPLE_FN;
async function getSample(){
  if(SAMPLE_FN!==undefined)return SAMPLE_FN;
  try{SAMPLE_FN=window.claude?await window.claude.use('sample'):null}catch(err){SAMPLE_FN=null}
  return SAMPLE_FN;
}
const ID_PROMPT=`Các ảnh đính kèm là ảnh thẻ căn cước công dân (CCCD) hoặc ảnh chụp màn hình ứng dụng VNeID của MỘT người. Hãy đọc chính xác từng ký tự, giữ đầy đủ dấu tiếng Việt, và chỉ trả về một đối tượng JSON, không thêm lời giải thích, không dùng markdown.
Các khóa:
- name: họ và tên, viết hoa chữ cái đầu mỗi từ theo cách viết tên người Việt
- dob: ngày sinh, định dạng YYYY-MM-DD
- gender: "Nam" hoặc "Nữ"
- cccd: số định danh cá nhân 12 số (không lấy số chứng minh nhân dân 9 số cũ)
- phone: số điện thoại di động nếu có trong ảnh
- home: quê quán
- addr: nơi thường trú, viết đầy đủ trên một dòng
Nếu một thông tin không có trong ảnh hoặc không đọc rõ thì để null, tuyệt đối không đoán. Nếu ảnh không phải giấy tờ tùy thân hoặc thuộc nhiều người khác nhau thì trả {"error":"lý do ngắn gọn"}.`;
async function readIdImages(files){
  const st=$('id_status');if(!st)return;
  const sample=await getSample();
  if(!sample){st.textContent='Chức năng đọc ảnh chỉ chạy khi mở trang này trong claude.ai.';return}
  let lim={};try{lim=await sample.limits()}catch(err){}
  if(!lim.images){st.textContent='Chỗ bạn đang mở chưa hỗ trợ gửi ảnh để đọc.';return}
  const arr=Array.from(files).slice(0,lim.images.maxCount||4);
  st.innerHTML='<span class="spin"></span>Đang đọc '+arr.length+' ảnh…';
  try{
    const r=await sample.json(ID_PROMPT,{images:arr});
    if(!$('id_status'))return;
    if(!r||r.error){$('id_status').textContent='Không đọc được: '+((r&&r.error)||'kết quả trống')+'. Hãy chọn ảnh khác.';return}
    const map=[['name','f_name','Họ tên'],['dob','f_dob','Ngày sinh'],['gender','f_gender','Giới tính'],['cccd','f_cccd','Số CCCD'],['phone','f_phone','Điện thoại'],['home','f_home','Nguyên quán'],['addr','f_addr','Thường trú']];
    let ok=0;const miss=[];
    map.forEach(([k,id,lab])=>{
      let v=r[k];if(v==null||v==='')v=null;
      if(v!=null&&k==='dob'&&!/^\d{4}-\d{2}-\d{2}$/.test(v))v=null;
      if(v!=null&&k==='gender'&&v!=='Nam'&&v!=='Nữ')v=null;
      if(v!=null&&k==='phone')v=String(v).replace(/[^\d]/g,'');
      const el=$(id);
      if(v==null||!el){miss.push(lab);return}
      el.value=String(v).trim();el.classList.add('auto');ok++;
    });
    $('id_status').innerHTML='<b>Đã điền '+ok+' ô từ ảnh (tô vàng).</b>'+(miss.length?'<br>Chưa tìm thấy: '+miss.join(', ')+'. Bạn tự nhập hoặc tải thêm ảnh.':'')+'<br><span class="muted">Kiểm tra lại từng ô rồi bấm Lưu.</span>';
  }catch(e){
    const el=$('id_status');if(!el)return;
    const m={not_granted:'Bạn chưa cho phép trang này dùng Claude nên chưa đọc được ảnh.',rate_limited:'Đã đọc quá nhiều lần, hãy thử lại sau ít phút.',image_rejected:'Ảnh không đọc được hoặc quá lớn, hãy chọn ảnh khác.',invalid_json:'Chưa đọc ra kết quả rõ ràng. Thử lại hoặc chọn ảnh rõ hơn.',cancelled:''};
    el.textContent=(e&&e.code in m)?m[e.code]:'Chưa đọc được ảnh lúc này. Thử lại sau.';
  }
}

    S.mail.to=v;toast(v?'Đã lưu cài đặt email':'Đã lưu, nhưng chưa có địa chỉ nhận');
  },
  testMail:()=>{const v=$('mailTo').value.trim();toast(v?'Đã gửi thử tới '+v+' (bản thử, chưa gửi thật)':'Nhập địa chỉ email trước khi gửi thử')}
};
document.addEventListener('click',ev=>{
  if(ev.target.classList&&ev.target.classList.contains('backdrop')){closeModal();return}
  const t=ev.target.closest('[data-a]');
  if(t&&A[t.dataset.a]){ev.preventDefault();A[t.dataset.a](t.dataset)}
});
document.addEventListener('keydown',ev=>{
  if(ev.key==='Escape')closeModal();
  if((ev.key==='Enter')&&ev.target.matches&&ev.target.matches('tr[data-a]')){A[ev.target.dataset.a](ev.target.dataset)}
});
document.addEventListener('input',ev=>{
  if(ev.target.id==='q'){S.q=ev.target.value;refreshRows()}
});
document.addEventListener('change',async ev=>{
  const t=ev.target;
  if(t.id==='fpos'){S.pos=t.value;refreshRows()}
  else if(t.id==='fst'){S.st=t.value;refreshRows()}
  else if(t.id==='c_file'&&t.files[0]){const src=await readFile(t.files[0]);TMP.doc=src;showPrev(src,true)}
  else if(t.id==='c_list'&&t.files[0]){TMP.list=true;$('c_listname').textContent='Đã chọn: '+t.files[0].name}
  else if(t.id==='s_file'&&t.files[0]){
    const src=await readFile(t.files[0]);SIGTMP=await removeBg(src);
    $('s_pic').innerHTML=`<img src="${SIGTMP}" alt="Chữ ký đã tách nền">`;
  }
  else if(t.id==='id_files'&&t.files.length){readIdImages(t.files)}
  else if(t.id==='x_sig'){X.sig=t.value;$('paperHost').innerHTML=paper(emp(S.id))}
  else if(t.id==='x_date'&&t.value){X.date=t.value;$('paperHost').innerHTML=paper(emp(S.id))}
  else if(t.id==='x_scans'){X.scans=t.checked;$('scanHost').innerHTML=scanPages(emp(S.id))}
});
render();
</script>
</body>
</html>
